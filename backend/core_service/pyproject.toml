[project]
name = "core-service"
version = "1.0.0"
description = "Core Service for ReTrails by Team CurlX"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "greenlet>=3.0.0",
    "asyncpg>=0.29.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.4.0",
    "python-dotenv>=1.0.1",
    "httpx>=0.27.0",
    "fastapi-users[sqlalchemy]>=15.0.5",
    "aiosqlite>=0.22.1",
    "sqlmodel>=0.0.47",
    "alembic>=1.13.2",
    "psycopg[binary]>=3.2.1",
    "pyjwt[crypto]>=2.9.0",
    "passlib[bcrypt]>=1.7.4",
    "pwdlib[argon2]>=0.2.0",
    "python-multipart>=0.0.9",
    "jinja2>=3.1.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
