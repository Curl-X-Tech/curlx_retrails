<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{{ project_name }}{% endblock %}</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f1f5f9;
            color: #0f172a;
            -webkit-font-smoothing: antialiased;
        }
        .wrapper {
            width: 100%;
            table-layout: fixed;
            background-color: #f1f5f9;
            padding: 40px 0;
        }
        .content {
            max-width: 580px;
            margin: 0 auto;
            background-color: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            overflow: hidden;
        }
        .header {
            padding: 24px 32px;
            background-color: #0f172a;
            color: #ffffff;
        }
        .header h1 {
            margin: 0;
            font-size: 20px;
            font-weight: 700;
            letter-spacing: 0.5px;
            color: #ffffff;
        }
        .header p {
            margin: 4px 0 0 0;
            font-size: 13px;
            color: #94a3b8;
        }
        .body-content {
            padding: 32px;
            font-size: 15px;
            line-height: 1.6;
            color: #334155;
        }
        .body-content h2 {
            margin-top: 0;
            font-size: 18px;
            font-weight: 600;
            color: #0f172a;
        }
        .btn-container {
            margin: 28px 0;
            text-align: center;
        }
        .btn {
            display: inline-block;
            background-color: #0f172a;
            color: #ffffff !important;
            padding: 12px 28px;
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
            border-radius: 6px;
        }
        .callout {
            margin: 24px 0;
            padding: 16px;
            background-color: #f8fafc;
            border-left: 4px solid #0f172a;
            border-radius: 4px;
            font-size: 13px;
            color: #475569;
            word-break: break-all;
        }
        .footer {
            padding: 24px 32px;
            background-color: #f8fafc;
            border-top: 1px solid #e2e8f0;
            font-size: 12px;
            color: #64748b;
            text-align: center;
            line-height: 1.5;
        }
    </style>
</head>
<body>
    <div class="wrapper">
        <div class="content">
            <div class="header">
                <h1>{{ project_name }}</h1>
                <p>Fleet and Transit Logistics Platform</p>
            </div>
            <div class="body-content">
                {% block content %}{% endblock %}
            </div>
            <div class="footer">
                <p>This is an automated notification from {{ project_name }}. Please do not reply directly to this email.</p>
            </div>
        </div>
    </div>
</body>
</html>
