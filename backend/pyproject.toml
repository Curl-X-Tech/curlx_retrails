[project]
name = "retrails-backend"
version = "0.1.0"
description = "FastAPI backend for ReTrails by Team CurlX"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "greenlet>=3.0.0",
    "asyncpg>=0.29.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.4.0",
    "python-dotenv>=1.0.1",
    "httpx>=0.27.0",
    "fastapi-users[sqlalchemy]>=15.0.5",
    "aiosqlite>=0.22.1",
    "sqlmodel>=0.0.47",
    "ortools>=9.10.4067",
    "celery>=5.4.0",
    "redis>=5.0.8",
    "alembic>=1.13.2",
    "psycopg[binary]>=3.2.1",
    "pyjwt[crypto]>=2.9.0",
    "passlib[bcrypt]>=1.7.4",
    "pwdlib[argon2]>=0.2.0",
    "python-multipart>=0.0.9",
    "jinja2>=3.1.4",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core_service", "planning_service"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501", "B008", "DTZ003"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "ignore:.*starlette.*",
    "ignore:.*httpx.*",
    "ignore::DeprecationWarning",
]
