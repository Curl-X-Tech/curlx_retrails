name: CI Quality & Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-quality:
    name: Backend Lint, Format & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: cd backend && uv sync

      - name: Run Ruff Lint
        run: cd backend && uv run ruff check .

      - name: Run Ruff Format Check
        run: cd backend && uv run ruff format --check .

      - name: Run Pytest
        run: cd backend && uv run pytest

  frontend-quality:
    name: Frontend Lint, Typecheck & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: cd frontend && bun install

      - name: Typecheck
        run: cd frontend && bun run typecheck

      - name: Prettier Format Check
        run: cd frontend && bun run format:check

      - name: Build PWA
        run: cd frontend && bun run build

  emails-quality:
    name: Email Templates Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: cd packages/emails && bun install

      - name: Typecheck
        run: cd packages/emails && bun run typecheck

      - name: Prettier Format Check
        run: cd packages/emails && bun run format:check
