name: retrails

# Waypoint Group — Service-Based Architecture Platform Stack
# Run: docker compose up --build
#
# Port Registry:
#   5173  -- Frontend (React PWA via Nginx)
#   8000  -- Core Service (Auth, Users, Master Domain, Orders, Routes, Vehicles, Dispatch)
#   8005  -- Planning Engine Service
#   5432  -- PostgreSQL
#   5050  -- pgAdmin 4 Web UI
#   6379  -- Redis
#   5672  -- RabbitMQ (AMQP)
#   15672 -- RabbitMQ Management UI (waypoint/waypoint)

services:

  # -- Infrastructure -------------------------------------------------------- #

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: waypoint-rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: waypoint
      RABBITMQ_DEFAULT_PASS: waypoint
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:16-alpine
    container_name: waypoint-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: waypoint
      POSTGRES_PASSWORD: waypoint
      POSTGRES_DB: waypoint
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/helpers/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U waypoint"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: waypoint-pgadmin
    restart: unless-stopped
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: 2001rvh1@gmail.com
      PGADMIN_DEFAULT_PASSWORD: admin1234
      PGADMIN_CONFIG_SERVER_MODE: "False"
    depends_on:
      postgres:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    container_name: waypoint-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # -- Application Services -------------------------------------------------- #

  core-service:
    build:
      context: ./backend/core_service
      dockerfile: Dockerfile
    container_name: waypoint-core
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://waypoint:waypoint@postgres:5432/general_db
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key-super-secure-waypoint-curlx}
    networks:
      default:
        aliases:
          - backend
          - core-service
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy

  planning-service:
    build:
      context: ./backend/planning_service
      dockerfile: Dockerfile
    container_name: waypoint-planning
    restart: unless-stopped
    ports:
      - "8005:8005"
    environment:
      DATABASE_URL: postgresql://waypoint:waypoint@postgres:5432/planning_db
      REDIS_URL: redis://redis:6379/0
      RABBITMQ_URL: amqp://waypoint:waypoint@rabbitmq:5672/
      CORE_SERVICE_URL: http://core-service:8000
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8005/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      core-service:
        condition: service_healthy

  planning-celery-worker:
    build:
      context: ./backend/planning_service
      dockerfile: Dockerfile
    container_name: waypoint-planning-worker
    restart: unless-stopped
    command: celery -A app.core.job_worker worker --loglevel=info --concurrency=4
    environment:
      DATABASE_URL: postgresql://waypoint:waypoint@postgres:5432/planning_db
      REDIS_URL: redis://redis:6379/0
      RABBITMQ_URL: amqp://waypoint:waypoint@rabbitmq:5672/
      CORE_SERVICE_URL: http://core-service:8000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_MAP_TILE_URL: https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png
        VITE_APP_NAME: ReTrails
    container_name: waypoint-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      core-service:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
